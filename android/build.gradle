plugins {
    id 'com.android.application'
}

android {
    namespace 'henry.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.henry.herisson'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
