plugins {
    id 'com.android.application'
}

android {
    namespace 'henry.quincaillerie'
    compileSdk 34

    defaultConfig {
        applicationId 'com.henry.quincaillerie'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Une clé de signature fixe, enregistrée dans le dépôt : chaque nouvel APK peut ainsi
    // s'installer par-dessus l'ancien sans effacer les données de la boutique.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
