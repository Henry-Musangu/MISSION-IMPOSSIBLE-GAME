<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--APP-->
<title>Ma Quincaillerie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : une colonne « application » (640px max), en-tête collant à la couleur choisie,
   navigation fixe en bas, et une feuille qui monte du bas pour chaque saisie. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --surface-2: #e8ecf2;
  --ink: #16202f; --ink-2: #5a6679; --line: #d9dfe8;
  --blue: #1d5fd0;  --blue-soft: #e2ebfb;
  --rose: #c9285f;  --rose-soft: #fbe3eb;
  --green: #17804a; --green-soft: #ddf2e5;
  --grey: #4a566b;  --grey-soft: #e4e8ef;
  --amber: #a45a00; --amber-soft: #fcecd2;
  --on-accent: #ffffff;
  --veil: rgba(10, 16, 26, .5);
  --shadow: 0 1px 2px rgba(22, 32, 47, .06), 0 4px 14px rgba(22, 32, 47, .06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --accent: var(--blue); --accent-soft: var(--blue-soft);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151d; --surface: #19202b; --surface-2: #232c3a;
    --ink: #e9eef6; --ink-2: #9aa6b8; --line: #2c3644;
    --blue: #74a4ff;  --blue-soft: #1b2c4b;
    --rose: #ff86ac;  --rose-soft: #47212f;
    --green: #62d394; --green-soft: #163526;
    --grey: #b3bdcd;  --grey-soft: #2a323e;
    --amber: #f0b25a; --amber-soft: #40300f;
    --on-accent: #0e141d;
    --veil: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151d; --surface: #19202b; --surface-2: #232c3a;
  --ink: #e9eef6; --ink-2: #9aa6b8; --line: #2c3644;
  --blue: #74a4ff;  --blue-soft: #1b2c4b;
  --rose: #ff86ac;  --rose-soft: #47212f;
  --green: #62d394; --green-soft: #163526;
  --grey: #b3bdcd;  --grey-soft: #2a323e;
  --amber: #f0b25a; --amber-soft: #40300f;
  --on-accent: #0e141d;
  --veil: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
:root[data-accent="rose"]  { --accent: var(--rose);  --accent-soft: var(--rose-soft); }
:root[data-accent="vert"]  { --accent: var(--green); --accent-soft: var(--green-soft); }
:root[data-accent="gris"]  { --accent: var(--grey);  --accent-soft: var(--grey-soft); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font: 15px/1.4 var(--font); -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--accent);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tn { font-variant-numeric: tabular-nums; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--accent); color: var(--on-accent); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 11px; }
.top .wrap > div { min-width: 0; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top p { margin: 0; font-size: 12.5px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .when { font-size: 12.5px; opacity: .9; text-align: right; flex: none; margin-left: 12px; }

/* Vue */
#view { padding-block: 14px 150px; display: grid; grid-template-columns: minmax(0, 1fr); grid-gap: 14px; gap: 14px; }
h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-2); }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.card > h2 { margin-bottom: 10px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.pos { color: var(--green); } .neg { color: var(--rose); }

/* Carte du jour */
.today { background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.today .lbl { font-size: 13px; opacity: .85; }
.today .big { font-size: 34px; font-weight: 800; line-height: 1.15; margin: 2px 0 10px; }
.today .pair { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; border-top: 1px solid var(--on-accent); padding-top: 10px; }
.today .pair b { display: block; font-size: 18px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 10px; gap: 10px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tile { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 11px 12px; min-width: 0; text-align: left; border: 0; }
.tile .lbl { font-size: 12px; color: var(--ink-2); display: block; }
.tile b { font-size: 16px; display: block; overflow-wrap: anywhere; }
.tile.big b { font-size: 20px; }
@media (max-width: 380px) { .tiles:not(.two) { grid-template-columns: 1fr 1fr; } }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 650; font-size: 15px;
  text-align: center;
}
.btn svg { margin-right: 7px; flex: none; }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.g { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.btn.d { color: var(--rose); border-color: var(--rose); background: transparent; }
.btn.s { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:active { opacity: .8; }
.acts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-gap: 10px; gap: 10px; }
.acts .btn { min-width: 0; padding: 0 8px; }
.acts .full { grid-column: 1 / -1; min-height: 54px; font-size: 17px; }

/* Listes */
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.row {
  display: flex; align-items: center; width: 100%; padding: 11px 0; border: 0; background: none; text-align: left;
  border-top: 1px solid var(--line); min-height: 52px;
}
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; padding-right: 10px; }
.row .main b { display: block; font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
.row .main span { display: block; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.row .side { text-align: right; flex: none; }
.row .side b { display: block; font-size: 15.5px; }
.row .side span { font-size: 12.5px; color: var(--ink-2); }
.row.off { opacity: .5; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; margin-right: 11px; }
.ico.v { background: var(--green-soft); color: var(--green); }
.ico.d { background: var(--rose-soft); color: var(--rose); }
.ico.a { background: var(--blue-soft); color: var(--blue); }
.ico.f { background: var(--grey-soft); color: var(--grey); }
.day { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 12px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
.day:first-child { padding-top: 0; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.low { background: var(--amber-soft); color: var(--amber); }
.badge.out { background: var(--rose-soft); color: var(--rose); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.qty { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-left: 10px; flex: none; }

/* Recherche et filtres */
.tools { display: flex; }
.tools .search { flex: 1; min-width: 0; }
.tools .btn { margin-left: 10px; flex: none; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; margin-top: -9px; color: var(--ink-2); }
input[type=text], input[type=search], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); outline: none; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.search input[type=search] { padding-left: 38px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.chips { display: flex; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; margin-right: 8px; min-height: 36px; padding: 0 13px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.warn.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }

/* Formulaires */
.form { display: grid; grid-gap: 12px; gap: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-gap: 10px; gap: 10px; align-items: end; }
.cols.three { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
.hint { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.hint b { color: var(--ink); }
.check { display: flex; align-items: center; font-size: 14px; min-height: 40px; }
.check input { width: 22px; height: 22px; margin: 0 10px 0 0; accent-color: var(--accent); flex: none; }

/* Graphique des 7 jours */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 8px; gap: 8px; align-items: end; height: 150px; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.bar i { display: block; width: 100%; max-width: 44px; border-radius: 7px 7px 2px 2px; background: var(--accent-soft); border-top: 3px solid var(--accent); min-height: 3px; }
.bar.now i { background: var(--accent); }
.bar em { font-style: normal; font-size: 11.5px; color: var(--ink-2); margin-bottom: 3px; }
.bar span { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.bar.now span { color: var(--ink); font-weight: 700; }

/* Répartition de l'argent */
.split { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 10px 0; }
.split i { display: block; height: 100%; }
.split .c1, .dot.c1 { background: var(--blue); } .split .c2, .dot.c2 { background: var(--green); } .split .c3, .dot.c3 { background: var(--rose); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv.total { font-weight: 700; font-size: 16px; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 99px; }

/* Bandeau démo */
.demo { background: var(--rose-soft); color: var(--ink); border: 1.5px dashed var(--rose); border-radius: 14px; padding: 12px 14px; }
.demo b { color: var(--rose); }
.demo .btn { margin-top: 10px; }

/* Navigation */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 8px 0 7px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; min-width: 0; }
.tab svg { margin-bottom: 2px; }
.tab.on { color: var(--accent); }
.tab.on svg { background: var(--accent-soft); border-radius: 99px; }
.tab svg { padding: 3px 14px; width: 52px; height: 30px; }

/* Barre du panier */
.cartbar { position: fixed; left: 0; right: 0; z-index: 7; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
.cartbar button { width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 54px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--green); color: var(--on-accent); font-size: 16px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }

/* Feuille, dialogue, message */
.veil { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--veil); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding-top: 14px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); -webkit-overflow-scrolling: touch; }
.sheet header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet header h3 { margin: 0; font-size: 19px; }
.x { width: 40px; height: 40px; border-radius: 99px; border: 0; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: none; margin-left: 10px; }
.veil.mid { z-index: 30; align-items: center; padding: 20px; }
.dialog { background: var(--surface); border-radius: 16px; padding: 18px; max-width: 380px; width: 100%; }
.dialog h3 { margin: 0 0 6px; font-size: 18px; }
.dialog p { margin: 0 0 16px; color: var(--ink-2); }
.dialog .acts { grid-template-columns: 1fr 1fr; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(74px + env(safe-area-inset-top, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; max-width: 88%; text-align: center; box-shadow: var(--shadow); }

/* Ligne du panier */
.line { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.line .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.line .ctl { display: flex; align-items: center; margin-top: 8px; }
.step { display: flex; align-items: center; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; line-height: 1; }
.step input { width: 58px; min-height: 40px; margin: 0 6px; text-align: center; padding: 6px; }
.line .pu { margin-left: auto; display: flex; align-items: center; }
.line .pu input { width: 86px; min-height: 40px; text-align: right; padding: 6px 8px; margin-left: 6px; }
.sw { display: flex; }
.sw button { width: 46px; height: 46px; border-radius: 99px; border: 3px solid var(--surface); margin-right: 12px; box-shadow: 0 0 0 1.5px var(--line); }
.sw button.on { box-shadow: 0 0 0 3px var(--ink); }
.sw .bleu { background: var(--blue); } .sw .rose { background: var(--rose); } .sw .vert { background: var(--green); } .sw .gris { background: var(--grey); }
.empty { text-align: center; color: var(--ink-2); padding: 22px 8px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div><h1 id="shopName">Ma Quincaillerie</h1><p id="shopPlace"></p></div><div class="when" id="when"></div></div></header>
<main class="wrap" id="view"></main>
<div id="cartbar"></div>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<div id="sheetHost"></div>
<div id="dialogHost"></div>
<div id="toastHost"></div>

function prod(id) { for (var i = 0; i < S.produits.length; i++) if (S.produits[i].id === id) return S.produits[i]; return null; }

function vProfit(v) { return sum(v.lignes, function (l) { return (l.pu - l.pa) * l.qte; }); }
function caisse() {
  return r2(sum(S.fonds, function (f) { return f.type === 'apport' ? f.montant : -f.montant; })
    + sum(S.ventes, function (v) { return v.paye ? v.total : 0; })
    - sum(S.achats, function (a) { return a.gratuit ? 0 : a.total; })
    - sum(S.depenses, function (d) { return d.montant; }));
}
function capital() { return r2(sum(S.fonds, function (f) { return f.type === 'apport' ? f.montant : -f.montant; })); }
function valStock() { return r2(sum(S.produits, function (p) { return p.stock * p.pa; })); }
function dettes() { return r2(sum(S.ventes, function (v) { return v.paye ? 0 : v.total; })); }
function etat(p) { return p.stock <= 0 ? 'out' : (p.stock <= p.seuil ? 'low' : 'ok'); }

function depuis(per) {
  if (per === 'jour') return daysAgo(0);
  if (per === '7j') return daysAgo(6);
  if (per === 'mois') { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(1); return d.getTime(); }
  return 0;
}
function bilan(from, to) {
  to = to || Infinity;
  var vs = S.ventes.filter(function (v) { return v.t >= from && v.t < to; });
  var ca = sum(vs, function (v) { return v.total; });
  var brut = sum(vs, vProfit);
  var dep = sum(S.depenses, function (d) { return d.t >= from && d.t < to ? d.montant : 0; });
  return { n: vs.length, ca: r2(ca), brut: r2(brut), dep: r2(dep), net: r2(brut - dep), ventes: vs };
}

function finishSale(paye) {
  if (!ui.cart.length) return;
  var client = ui.client.trim();
  if (!paye && !client) { toast('Écrivez le nom du client pour une vente à crédit'); var c = $('#client'); if (c) c.focus(); return; }
  var lignes = [];
  for (var i = 0; i < ui.cart.length; i++) {
    var l = ui.cart[i], p = prod(l.pid);
    if (!p) continue;
    if (l.qte > p.stock) return toast('Stock insuffisant pour ' + p.nom + ' (reste ' + qf(p.stock) + ')');
    lignes.push({ pid: p.id, nom: p.nom, qte: l.qte, pu: l.pu, pa: p.pa });
  }
  lignes.forEach(function (l) { var p = prod(l.pid); p.stock = r2(p.stock - l.qte); });
  var total = r2(sum(lignes, function (l) { return l.pu * l.qte; }));
  S.ventes.push({ id: nid(), t: Date.now(), lignes: lignes, total: total, client: client, paye: paye });
  ui.cart = []; ui.client = '';

function defMarge(catId) { for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === catId) return S.cats[i].marge; return S.shop.marge; }
function field(l, input) { var id = (input.match(/id="([^"]+)"/) || [])[1]; return '<div class="field"><label for="' + id + '">' + l + '</label>' + input + '</div>'; }
function val(id) { var e = $('#' + id); return e ? e.value : ''; }
function prodHint() {
  var pa = num(val('p_pa')), pv = num(val('p_pv')), h = $('#p_hint'); if (!h) return;
  if (pa <= 0 && pv <= 0) h.innerHTML = 'Entrez le prix d\'achat : le prix de vente est calculé avec la marge. Vous pouvez aussi écrire directement votre prix de vente.';
  else h.innerHTML = 'Bénéfice par ' + esc(val('p_unite') || 'unité') + ' vendu(e) : <b class="num ' + (pv - pa >= 0 ? 'pos' : 'neg') + '">' + money(pv - pa) + '</b>' + (pv < pa ? ' — vous vendez à perte.' : '');
}
function saveProduct() {
  var f = $('[data-form="prod"]'), id = +f.dataset.id || 0, p = id ? prod(id) : null;
  var nom = val('p_nom').trim(), pa = r2(num(val('p_pa'))), pv = r2(num(val('p_pv'))), stock = r2(num(val('p_stock'))), seuil = r2(num(val('p_seuil')));
  if (!nom) { toast('Écrivez le nom du produit'); $('#p_nom').focus(); return; }
  if (pa < 0 || pv <= 0) { toast('Entrez un prix de vente'); $('#p_pv').focus(); return; }
  if (stock < 0) stock = 0;
  var cat = +val('p_cat') || '', unite = val('p_unite').trim() || 'pièce';
  if (p) {
    p.nom = nom; p.cat = cat; p.unite = unite; p.pa = pa; p.pv = pv; p.stock = stock; p.seuil = seuil;
  } else {
    p = { id: nid(), nom: nom, cat: cat, unite: unite, pa: pa, pv: pv, stock: stock, seuil: seuil };
    S.produits.push(p);
    if (stock > 0) S.achats.push({ id: nid(), t: Date.now(), pid: p.id, nom: nom, qte: stock, pa: pa, total: r2(stock * pa), gratuit: !$('#p_paye').checked });

function openReappro(id) {
  var p = prod(id); if (!p) return;

function saveReappro() {
  var f = $('[data-form="reappro"]'), p = prod(+f.dataset.id), q = r2(num(val('r_qte'))), pa = r2(num(val('r_pa')));
  if (!p) return;
  if (q <= 0) { toast('Entrez la quantité achetée'); $('#r_qte').focus(); return; }

/* ───────────── Bilan ───────────── */
var PERS = [['jour', "Aujourd'hui"], ['7j', '7 jours'], ['mois', 'Ce mois'], ['tout', 'Tout']];
function vBilan() {
  var from = depuis(ui.per), b = bilan(from);
  var h = '<div class="chips">' + PERS.map(function (p) { return '<button class="chip' + (ui.per === p[0] ? ' on' : '') + '" data-a="per" data-id="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="tiles two"><div class="tile big"><span class="lbl">Ventes (' + b.n + ')</span><b class="num">' + money(b.ca) + '</b></div>'
    + '<div class="tile big"><span class="lbl">Bénéfice sur ventes' + (b.ca ? ' · ' + pct(b.brut / b.ca * 100) : '') + '</span><b class="num pos">' + money(b.brut) + '</b></div>'
    + '<div class="tile big"><span class="lbl">Dépenses</span><b class="num neg">' + money(b.dep) + '</b></div>'
    + '<div class="tile big"><span class="lbl">Bénéfice net</span><b class="num ' + (b.net >= 0 ? 'pos' : 'neg') + '">' + signed(b.net) + '</b></div></div>';

  var agg = {}, tops = [];
  b.ventes.forEach(function (v) { v.lignes.forEach(function (l) { var a = agg[l.nom] || (agg[l.nom] = { nom: l.nom, q: 0, ca: 0, b: 0 }); a.q += l.qte; a.ca += l.pu * l.qte; a.b += (l.pu - l.pa) * l.qte; }); });
  Object.keys(agg).forEach(function (k) { tops.push(agg[k]); });
  tops.sort(function (x, y) { return y.b - x.b; });
  if (tops.length) {
    var mx = tops[0].b || 1;
    h += '<section class="card"><h2>Produits qui rapportent le plus</h2>' + tops.slice(0, 5).map(function (t) {
      return '<div style="padding:7px 0"><div class="kv" style="padding:0;border:0"><span>' + esc(t.nom) + ' <span class="muted small">× ' + qf(t.q) + '</span></span><b class="num pos">' + money(t.b) + '</b></div><div class="meter"><i style="width:' + Math.max(2, t.b / mx * 100) + '%"></i></div></div>';
    }).join('') + '</section>';
  }

  var ops = [];
  b.ventes.forEach(function (v) { ops.push({ k: 'v', id: v.id, t: v.t, a: v.total, l: v.lignes.map(function (l) { return l.nom + ' × ' + qf(l.qte); }).join(', '), s: v.paye ? (v.client || 'Vente') : 'À crédit · ' + v.client, due: !v.paye }); });
  S.depenses.forEach(function (d) { if (d.t >= from) ops.push({ k: 'd', id: d.id, t: d.t, a: -d.montant, l: d.cat, s: d.note || 'Dépense' }); });
  S.achats.forEach(function (a) { if (a.t >= from) ops.push({ k: 'a', id: a.id, t: a.t, a: a.gratuit ? 0 : -a.total, l: a.nom + ' × ' + qf(a.qte), s: a.init ? 'Stock de départ' : 'Réapprovisionnement' }); });
  S.fonds.forEach(function (f) { if (f.t >= from) ops.push({ k: 'f', id: f.id, t: f.t, a: f.type === 'apport' ? f.montant : -f.montant, l: f.type === 'apport' ? 'Fonds injecté' : 'Retrait du propriétaire', s: f.note || '' }); });
  ops.sort(function (x, y) { return y.t - x.t; });
  h += '<section class="card"><h2>Journal des opérations</h2>';
  if (!ops.length) h += '<div class="empty">Aucune opération sur cette période.</div>';
  else {
    var last = '';
    h += '<div class="list">' + ops.slice(0, ui.jmax).map(function (o) {
      var d = dlabel(o.t), head = d !== last ? '<div class="day">' + d + '</div>' : ''; last = d;
      var ic = { v: 'cart', d: 'down', a: 'truck', f: 'wallet' }[o.k];
      return head + '<button class="row" data-a="op" data-k="' + o.k + '" data-id="' + o.id + '"><span class="ico ' + o.k + '">' + svg(ic, 18) + '</span><div class="main"><b>' + esc(o.l) + '</b><span>' + hhmm(o.t) + (o.s ? ' · ' + esc(o.s) : '') + '</span></div>'
        + '<div class="side"><b class="num ' + (o.due ? 'neg' : (o.a >= 0 ? 'pos' : '')) + '">' + (o.due ? money(o.a) : signed(o.a)) + '</b>' + (o.due ? '<span>non payé</span>' : '') + '</div></button>';
    }).join('') + '</div>';
    if (ops.length > ui.jmax) h += '<button class="btn s wide" data-a="more" style="margin-top:10px">Afficher plus (' + (ops.length - ui.jmax) + ')</button>';
  }
  return h + '</section>';
}
function findIn(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function openOp(k, id) {

      + '<div class="kv total"><span>Total</span><span class="num">' + money(v.total) + '</span></div>'

      + (k === 'f' ? kv('Montant', money(o.montant)) : '')

  }

}
function delOp(k, id) {
  var msg = { v: 'La vente sera annulée et les articles remis en stock.', d: 'Cette dépense sera retirée des comptes.', a: 'Cet achat sera retiré et la quantité enlevée du stock.', f: 'Ce mouvement de fonds sera retiré des comptes.' }[k];
  ask('Confirmer ?', msg, k === 'v' ? 'Annuler la vente' : 'Supprimer', function () {
    var arr = { v: S.ventes, d: S.depenses, a: S.achats, f: S.fonds }[k], o = findIn(arr, id); if (!o) return;
    if (k === 'v') o.lignes.forEach(function (l) { var p = prod(l.pid); if (p) p.stock = r2(p.stock + l.qte); });
    if (k === 'a') { var p = prod(o.pid); if (p) p.stock = Math.max(0, r2(p.stock - o.qte)); }
    arr.splice(arr.indexOf(o), 1);

  });
}

  }).join('') + '</div></div></div>' : '<div class="empty">Aucun client ne vous doit de l\'argent.<br>Les ventes à crédit apparaîtront ici.</div>');
}
function openBoutique() {
  sheet('Ma boutique', '<div class="form">'
    + field('Nom de la quincaillerie', '<input type="text" id="b_nom" value="' + esc(S.shop.nom) + '" autocomplete="off">')
    + field('Emplacement', '<input type="text" id="b_lieu" value="' + esc(S.shop.lieu) + '" placeholder="Avenue, quartier, ville" autocomplete="off">')
    + '<div class="cols three">' + field('Monnaie', '<input type="text" id="b_dev" value="' + esc(S.shop.devise) + '" placeholder="$, FC, €…" autocomplete="off">')
    + field('Centimes', '<select id="b_dec"><option value="2"' + (S.shop.dec === 2 ? ' selected' : '') + '>Oui (0,00)</option><option value="0"' + (S.shop.dec === 0 ? ' selected' : '') + '>Non</option></select>')
    + field('Marge par défaut %', '<input type="text" inputmode="decimal" id="b_m" value="' + inp(S.shop.marge) + '">') + '</div>'
    + '<div class="hint">La marge s\'applique au prix d\'achat. Exemple : achat à 10 avec 30 % de marge = vente à 13.</div>'
    + '<button class="btn p wide" data-a="saveboutique">Enregistrer</button></div>');
}
function openCats() {
  sheet('Catégories et marges', '<div class="form" id="catform"><div class="hint">La marge d\'une catégorie est proposée quand vous ajoutez un produit. Vous pouvez toujours la changer produit par produit.</div>'
    + S.cats.map(function (c) { return catRow(c.id, c.nom, c.marge); }).join('')
    + '<button class="btn" data-a="addcat">' + svg('plus') + 'Ajouter une catégorie</button><button class="btn p wide" data-a="savecats">Enregistrer</button></div>');
}
function catRow(id, nom, m) {
  return '<div class="line catrow" data-id="' + id + '"><div class="ctl" style="margin:0"><input type="text" class="c_nom" id="c_nom' + id + '" value="' + esc(nom) + '" placeholder="Nom" aria-label="Nom de la catégorie" style="flex:1;min-width:0">'
    + '<input type="text" inputmode="decimal" class="c_m" id="c_m' + id + '" value="' + inp(m) + '" aria-label="Marge en %" style="width:64px;margin:0 6px;text-align:right"><span class="muted">%</span>'
    + '<button class="x" data-a="delcat" aria-label="Supprimer la catégorie">' + svg('x', 16) + '</button></div></div>';
}
function openStart() {
  sheet('Démarrer avec mes chiffres', '<div class="form"><div class="hint">Les ventes, dépenses et stocks de la démonstration seront effacés. Vous fixez tout vous-même.</div>'
    + field('Nom de la quincaillerie', '<input type="text" id="s_nom" value="' + esc(S.shop.nom) + '" autocomplete="off">')
    + field('Emplacement', '<input type="text" id="s_lieu" value="' + esc(S.demo ? '' : S.shop.lieu) + '" placeholder="Avenue, quartier, ville" autocomplete="off">')
    + '<div class="cols three">' + field('Fonds injecté', '<input type="text" inputmode="decimal" id="s_fonds" placeholder="Ex. 1500">')
    + field('Monnaie', '<input type="text" id="s_dev" value="' + esc(S.shop.devise) + '" autocomplete="off">')
    + field('Marge par défaut %', '<input type="text" inputmode="decimal" id="s_m" value="' + inp(S.shop.marge) + '">') + '</div>'
    + '<label class="check"><input type="checkbox" id="s_keep" checked>Garder la liste des produits (stocks remis à zéro, prix modifiables)</label>'
    + '<button class="btn p wide" data-a="dostart">Démarrer ma boutique</button></div>');
}
function doStart() {
  var st = baseState(), keep = $('#s_keep').checked, fonds = r2(num(val('s_fonds')));
  st.accent = S.accent;
  st.shop.nom = val('s_nom').trim() || 'Ma Quincaillerie';
  st.shop.lieu = val('s_lieu').trim();
  st.shop.devise = val('s_dev').trim() || '$';
  st.shop.dec = S.shop.dec;
  st.shop.marge = num(val('s_m')) || 30;
  st.seq = S.seq;
  st.cats = S.cats;
  if (keep) st.produits = S.produits.map(function (p) { p.stock = 0; return p; });
  if (fonds > 0) st.fonds.push({ id: st.seq++, t: Date.now(), type: 'apport', montant: fonds, note: 'Fonds de départ' });
  S = st; ui.cart = [];
  closeSheet(); go('accueil'); save();
  toast('C\'est parti : votre boutique est prête');
}
function reportText() {
  var j = bilan(daysAgo(0)), al = alertes(), d = new Date();
  var t = '📋 ' + S.shop.nom + ' — rapport du ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear() + '\n'
    + 'Ventes : ' + money(j.ca) + ' (' + j.n + ')\nBénéfice sur ventes : ' + money(j.brut) + '\nDépenses : ' + money(j.dep) + '\nBénéfice net : ' + money(j.net)
    + '\nEn caisse : ' + money(caisse()) + '\nValeur du stock : ' + money(valStock()) + '\nDettes clients : ' + money(dettes());
  if (al.length) t += '\nÀ réapprovisionner : ' + al.map(function (p) { return p.nom + ' (' + qf(p.stock) + ')'; }).join(', ');
  return t.replace(/ /g, ' ');
}
function copyBox(title, text, note) {
  sheet(title, '<div class="form"><div class="hint">' + note + '</div><textarea id="cp_t" readonly>' + esc(text) + '</textarea><button class="btn p wide" data-a="copy">Copier</button></div>');
}

/* ───────────── Feuille, dialogue, message ───────────── */
function sheet(title, html) {
  $('#sheetHost').innerHTML = '<div class="veil" data-a="veil"><div class="sheet" role="dialog" aria-label="' + esc(title) + '"><header><h3>' + title + '</h3><button class="x" data-a="close" aria-label="Fermer">' + svg('x', 18) + '</button></header>' + html + '</div></div>';
}
function closeSheet() { $('#sheetHost').innerHTML = ''; }
var askFn = null;
function ask(title, msg, ok, fn) {
  askFn = fn;
  $('#dialogHost').innerHTML = '<div class="veil mid"><div class="dialog" role="alertdialog"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="acts"><button class="btn" data-a="askno">Retour</button><button class="btn d" data-a="askyes">' + esc(ok) + '</button></div></div></div>';
}
function closeAsk() { $('#dialogHost').innerHTML = ''; askFn = null; }
var toastT = 0;
function toast(msg) {
  $('#toastHost').innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toastT); toastT = setTimeout(function () { $('#toastHost').innerHTML = ''; }, 2600);
}

/* ───────────── Actions ───────────── */
var A = {
  tab: function (el) { go(el.dataset.tab); },
  close: closeSheet,
  veil: function (el, e) { if (e.target === el) closeSheet(); },
  askno: closeAsk,
  askyes: function () { var f = askFn; closeAsk(); if (f) f(); },
  start: openStart, dostart: doStart,
  demo: function () { ask('Revoir la démonstration ?', 'Vos données actuelles seront remplacées par l\'exemple. Faites d\'abord une sauvegarde si vous voulez les garder.', 'Remplacer', function () { var a = S.accent; S = demoState(); S.accent = a; ui.cart = []; go('accueil'); save(); }); },
  cat: function (el) { ui.cat = +el.dataset.id || ''; ui.bas = false; renderList(); },
  bas: function () { ui.bas = !ui.bas; ui.cat = ''; renderList(); },
  voirbas: function () { go('stock'); ui.bas = true; renderList(); },
  goreappro: function () { go('stock'); toast('Touchez un produit, puis « Réapprovisionner »'); },
  add: function (el) { addToCart(+el.dataset.id); },
  panier: openCart,
  cq: function (el) {
    var l = cartLine(+el.dataset.id), p = prod(+el.dataset.id); if (!l || !p) return;
    var q = r2(l.qte + (+el.dataset.d));
    if (q > p.stock) return toast('Stock insuffisant : il reste ' + qf(p.stock) + ' ' + p.unite);
    if (q <= 0) ui.cart.splice(ui.cart.indexOf(l), 1); else l.qte = q;
    openCart(); renderList(); renderCartBar();
  },
  vider: function () { ui.cart = []; ui.client = ''; closeSheet(); renderList(); renderCartBar(); },
  encaisser: function () { finishSale(true); },
  credit: function () { finishSale(false); },
  prod: function (el) { openProduct(+el.dataset.id); },
  newprod: function () { openProduct(0); },
  saveprod: saveProduct,
  delprod: function (el) {
    var id = +el.dataset.id, p = prod(id);
    ask('Supprimer ce produit ?', '« ' + p.nom + ' » sera retiré de la liste. Les ventes déjà faites restent dans le journal.', 'Supprimer', function () {
      S.produits.splice(S.produits.indexOf(p), 1);
      ui.cart = ui.cart.filter(function (l) { return l.pid !== id; });
      closeSheet(); commit('Produit supprimé');
    });
  },
  reappro: function (el) { openReappro(+el.dataset.id); },
  savereappro: saveReappro,
  per: function (el) { ui.per = el.dataset.id; ui.jmax = 40; render(); },
  more: function () { ui.jmax += 60; render(); },
  op: function (el) { openOp(el.dataset.k, +el.dataset.id); },
  delop: function (el) { delOp(el.dataset.k, +el.dataset.id); },
  payer: function (el) { var v = findIn(S.ventes, +el.dataset.id); if (!v) return; v.paye = true; v.payeLe = Date.now(); closeSheet(); commit('Paiement reçu : ' + money(v.total)); },
  dep: openDepense,
  savedep: function () {
    var m = r2(num(val('d_m')));
    if (m <= 0) { toast('Entrez le montant de la dépense'); $('#d_m').focus(); return; }
    S.depenses.push({ id: nid(), t: Date.now(), cat: val('d_cat'), montant: m, note: val('d_note').trim() });
    closeSheet(); commit('Dépense notée : ' + money(m));
  },
  fonds: openFonds,
  addfonds: function (el) {
    var m = r2(num(val('f_m'))), type = el.dataset.id;
    if (m <= 0) { toast('Entrez un montant'); $('#f_m').focus(); return; }
    if (type === 'retrait' && m > caisse()) return toast('Il n\'y a que ' + money(caisse()) + ' en caisse');
    S.fonds.push({ id: nid(), t: Date.now(), type: type, montant: m, note: val('f_note').trim() });
    save(); render(); openFonds(); toast(type === 'apport' ? 'Fonds ajouté : ' + money(m) : 'Retrait noté : ' + money(m));
  },
  dettes: openDettes,
  boutique: openBoutique,
  saveboutique: function () {
    S.shop.nom = val('b_nom').trim() || 'Ma Quincaillerie'; S.shop.lieu = val('b_lieu').trim();
    S.shop.devise = val('b_dev').trim() || '$'; S.shop.dec = +val('b_dec'); S.shop.marge = num(val('b_m'));
    closeSheet(); commit('Boutique enregistrée');
  },
  cats: openCats,
  addcat: function (el) { el.insertAdjacentHTML('beforebegin', catRow('n' + Date.now(), '', S.shop.marge)); },
  delcat: function (el) { var r = el.closest('.catrow'); r.parentNode.removeChild(r); },
  savecats: function () {
    var rows = document.querySelectorAll('#catform .catrow'), out = [];
    for (var i = 0; i < rows.length; i++) {
      var nom = $('.c_nom', rows[i]).value.trim(); if (!nom) continue;
      var id = +rows[i].dataset.id || nid();
      out.push({ id: id, nom: nom, marge: num($('.c_m', rows[i]).value) });
    }
    S.cats = out;
    S.produits.forEach(function (p) { if (p.cat && !findIn(out, p.cat)) p.cat = ''; });
    closeSheet(); commit('Catégories enregistrées');
  },
  accent: function (el) { S.accent = el.dataset.id; commit(); },
  sharejour: function () {
    var t = reportText();
    if (bridge && bridge.shareText) bridge.shareText(t);
    else copyBox('Rapport du jour', t, 'Copiez ce rapport puis collez-le dans WhatsApp, un SMS ou un e-mail.');
  },
  export: function () {
    var t = JSON.stringify(S);
    if (bridge && bridge.exportBackup) bridge.exportBackup(t, 'quincaillerie-' + dkey(Date.now()) + '.json');
    else copyBox('Sauvegarder mes données', t, 'Copiez ce texte et gardez-le en lieu sûr (e-mail, note). Il contient toutes vos données.');
  },
  import: function () {
    if (bridge && bridge.importBackup) bridge.importBackup();
    else sheet('Restaurer une sauvegarde', '<div class="form"><div class="hint">Collez ici le texte de votre sauvegarde. Il remplacera les données actuelles.</div><textarea id="im_t" placeholder="Collez la sauvegarde ici"></textarea><button class="btn p wide" data-a="doimport">Restaurer</button></div>');
  },
  doimport: function () { restore(val('im_t')); },
  copy: function () {
    var t = $('#cp_t');
    function fallback() { t.focus(); t.select(); try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Sélectionnez le texte puis copiez-le'); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(function () { toast('Copié'); }, fallback); else fallback();
  }
};
function restore(text) {
  var o = null;
  try { o = JSON.parse(text); } catch (e) {}
  if (!valid(o)) return toast('Cette sauvegarde n\'est pas lisible');
  S = fix(o); ui.cart = [];
  closeSheet(); go('accueil'); save(); toast('Sauvegarde restaurée');
}
window.onBackupImported = restore;
window.onBackupSaved = function (ok) { toast(ok ? 'Sauvegarde enregistrée' : 'La sauvegarde a échoué'); };
window.onAndroidBack = function () {
  if ($('#dialogHost').firstChild) { closeAsk(); return true; }
  if ($('#sheetHost').firstChild) { closeSheet(); return true; }
  if (ui.tab !== 'accueil') { go('accueil'); return true; }
  return false;
};

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!el) return;
  var f = A[el.dataset.a];
  if (f) f(el, e);
});
document.addEventListener('input', function (e) {
  var k = e.target.dataset ? e.target.dataset.i : null;
  if (!k) return;
  if (k === 'q') { ui.q = e.target.value; renderList(); }
  else if (k === 'client') ui.client = e.target.value;
  else if (k === 'ppa' || k === 'pm') { var pa = num(val('p_pa')); if (pa > 0) $('#p_pv').value = inp(pa * (1 + num(val('p_m')) / 100)); prodHint(); }
  else if (k === 'ppv') { var a = num(val('p_pa')), v = num(val('p_pv')); if (a > 0 && v > 0) $('#p_m').value = inp((v / a - 1) * 100); prodHint(); }
  else if (k === 'rq') $('#r_tot').textContent = money(num(val('r_qte')) * num(val('r_pa')));
});
document.addEventListener('change', function (e) {
  var k = e.target.dataset ? e.target.dataset.c : null;
  if (!k) return;
  if (k === 'pcat') {
    var f = $('[data-form="prod"]');
    if (f && !f.dataset.id) { $('#p_m').value = inp(defMarge(+e.target.value)); var pa = num(val('p_pa')); if (pa > 0) $('#p_pv').value = inp(pa * (1 + num(val('p_m')) / 100)); prodHint(); }
    return;
  }
  var l = cartLine(+e.target.dataset.id), p = prod(+e.target.dataset.id); if (!l || !p) return;
  if (k === 'cqte') {
    var q = r2(num(e.target.value));
    if (q > p.stock) { q = p.stock; toast('Stock insuffisant : il reste ' + qf(p.stock) + ' ' + p.unite); }
    if (q <= 0) ui.cart.splice(ui.cart.indexOf(l), 1); else l.qte = q;
  } else if (k === 'cpu') { var pu = r2(num(e.target.value)); if (pu > 0) l.pu = pu; }
  openCart(); renderList(); renderCartBar();
});

render();
if (!readStore()) save();
})();
</script>
<!--/APP-->
</body>
</html>
