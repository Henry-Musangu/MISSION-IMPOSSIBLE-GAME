# New York Life — Open World : tests automatiques, test de jeu avec captures d'écran,
# puis export de l'APK Android et publication dans la Release « newyorklife ».
# Lien direct (téléphone) :
# https://github.com/Henry-Musangu/MISSION-IMPOSSIBLE-GAME/releases/download/newyorklife/new-york-life.apk
name: New York Life (Android)

on:
  push:
    paths:
      - 'newyorklife/**'
      - 'tools/android/**'
      - '.github/workflows/newyorklife.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Godot et les modèles d'export
        run: |
          set -e
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: Importer le projet
        run: |
          godot --headless --path newyorklife --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR" import.log; then exit 1; fi

      - name: Vérifier la compilation de tous les scripts
        run: |
          godot --headless --path newyorklife res://tests/check_scripts.tscn 2>&1 | tee check.log || true
          grep -q "CHECK RESULT: .* 0 en erreur" check.log

      - name: Tests automatisés
        run: |
          set -o pipefail
          timeout 300 godot --headless --path newyorklife res://tests/test_runner.tscn 2>&1 | tee tests.log
          grep -q "TESTS RESULT: PASS" tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" tests.log; then exit 1; fi

      - name: Test de jeu complet (rendu OpenGL logiciel) et captures
        if: success() || failure()
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p shots
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" godot --path newyorklife --rendering-driver opengl3 \
            --audio-driver Dummy --resolution 1280x720 -- --smoke --shots=$PWD/shots 2>&1 | tee smoke.log
          grep -q "SMOKE RESULT: PASS" smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR" smoke.log; then exit 1; fi

      - name: Exporter l'APK Android
        run: |
          set -e
          keytool -genkeypair -v -keystore ~/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p ~/.config/godot
          f=$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -1 || true)
          if [ -z "$f" ]; then
            f=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$f"
          fi
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$f"
          ks="$GITHUB_WORKSPACE/tools/android/nyl-test.keystore"
          sed -i "s|^keystore/release=\"\"|keystore/release=\"$ks\"|; s|^keystore/release_user=\"\"|keystore/release_user=\"nylife\"|; s|^keystore/release_password=\"\"|keystore/release_password=\"nylife-test\"|" newyorklife/export_presets.cfg
          sed -i "s|^version/code=1|version/code=${GITHUB_RUN_NUMBER}|" newyorklife/export_presets.cfg
          mkdir -p build
          godot --headless --path newyorklife --export-release "Android" "$PWD/build/new-york-life.apk" 2>&1 | tee export.log
          ls -la build
          test -s build/new-york-life.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-york-life
          path: |
            build/new-york-life.apk
            shots/
            *.log

      - name: Publier dans la Release « newyorklife »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/new-york-life.apk"
          for s in shots/*.png; do [ -f "$s" ] && files="$files $s"; done
          if gh release view newyorklife >/dev/null 2>&1; then
            gh release upload newyorklife $files --clobber
          else
            gh release create newyorklife $files --target "$GITHUB_SHA" --latest=false \
              --title "New York Life — Open World (Android)" \
              --notes "Télécharge new-york-life.apk sur ton téléphone Android et ouvre-le pour installer le jeu. Le fichier est remplacé automatiquement à chaque mise à jour du code."
          fi
