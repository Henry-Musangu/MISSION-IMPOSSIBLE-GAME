# Compile automatiquement les APK Android (et vérifie la version PC du jeu) à chaque envoi sur GitHub,
# puis les publie dans la Release « android » : liens directs à ouvrir depuis le téléphone
# https://github.com/Henry-Musangu/MISSION-IMPOSSIBLE-GAME/releases/latest/download/henry-le-herisson.apk
# https://github.com/Henry-Musangu/MISSION-IMPOSSIBLE-GAME/releases/download/android/ma-quincaillerie.apk
name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler la version PC
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out core/src/main/java/henry/*.java desktop/src/main/java/henry/desktop/*.java

      - name: Compiler les APK Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :quincaillerie:assembleDebug
          cp android/build/outputs/apk/debug/app-debug.apk henry-le-herisson.apk
          cp quincaillerie/build/outputs/apk/debug/quincaillerie-debug.apk ma-quincaillerie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: henry-le-herisson-apk
          path: henry-le-herisson.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ma-quincaillerie-apk
          path: ma-quincaillerie.apk

      - name: Publier les APK dans la Release « android »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android >/dev/null 2>&1; then
            gh release upload android henry-le-herisson.apk ma-quincaillerie.apk --clobber
          else
            gh release create android henry-le-herisson.apk ma-quincaillerie.apk --target "$GITHUB_SHA" --latest \
              --title "Applications Android" \
              --notes "Télécharge henry-le-herisson.apk (le jeu) ou ma-quincaillerie.apk (la gestion de la quincaillerie) sur ton téléphone et ouvre le fichier pour l'installer. Ces fichiers sont remplacés automatiquement à chaque mise à jour du code."
          fi
