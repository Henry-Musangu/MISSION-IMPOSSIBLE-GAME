// Application Android de l'agenda. Le cœur (agenda/core) est partagé avec la version PC.
plugins {
    id 'com.android.application'
}

android {
    namespace 'agenda.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.henry.agenda'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Clé de signature fixe (versionnée) : chaque nouvel APK peut s'installer par-dessus l'ancien
    // sans désinstaller, donc sans perdre l'agenda enregistré sur le téléphone.
    signingConfigs {
        fixed {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':agenda-core')
}
